# ===================================
# CI Practice - V1: Simple Smoke Test
# ===================================
# This workflow runs a quick smoke test to verify basic functionality
# Purpose: Learn the basics of GitHub Actions + Cypress

name: CI Practice

# Trigger: Run on push, schedule, and manual trigger
on:
  push:
    branches:
      - configure-pipeline-n-integrate-squashtm-teams
  schedule:
    - cron: '* * * * *'  # Every 1 minute
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  # Job 1: API tests - creates/verifies users
  test-api:
    name: TestA - API Users
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build:ci

      - name: Run API user tests
        uses: cypress-io/github-action@v6
        with:
          start: yarn start:ci
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/tests/api/api-users.spec.ts

  # Job 2: UI tests - depends on API tests passing
  test-ui:
    name: TestB - UI Auth
    needs: test-api  # Only runs if test-api succeeds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build:ci

      - name: Run UI auth tests
        uses: cypress-io/github-action@v6
        with:
          start: yarn start:ci
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/tests/ui/auth.spec.ts
